; Settings for s4l_remote.py (read from this file, next to the script).
[s4l]
; SSH target. EDIT THIS: replace USER@SERVER_HOSTNAME with the shared account and the
; server host name. Key-based login only; no password is ever stored or prompted.
host = USER@SERVER_HOSTNAME
; Job folder on the server, relative to the home directory. It must match what
; isolve-run uses (~/sim4life_jobs); change only if you also change the runner.
remote_dir = sim4life_jobs
; GPU used when --gpu is not given. GPU 0 and 1 are usable and shared; GPU 2 is not.
default_gpu = 0
; Seconds between status checks in the "run" command.
poll_seconds = 30
; Local log file name = <uuid> + log_suffix, saved next to the input file.
; iSolve itself writes <uuid>_Output.log on the server, which is what gets fetched.
log_suffix = _Output.log
; Name recorded as the job owner on the server. Empty = Windows user name.
owner =
